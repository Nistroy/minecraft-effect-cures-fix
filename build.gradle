plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		// Porting Lib n'est publié que dans le dépôt snapshots de devOS.
		name = 'devOS'
		url = 'https://mvn.devos.one/snapshots'
		content {
			includeGroup 'io.github.fabricators_of_create.Porting-Lib'
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "effectcuresfix-test"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Exécution seulement (tests) : en jeu, ce module est embarqué par Twilight Forest. Le mixin n'en utilise
	// aucune classe, seulement le champ qu'il ajoute à MobEffectInstance.
	modLocalRuntime "io.github.fabricators_of_create.Porting-Lib:entity:${project.porting_lib_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def name = project.archives_base_name
	inputs.property "archivesName", name
	from(file("LICENSE")) {
		rename { "${it}_${name}" }
	}
}
